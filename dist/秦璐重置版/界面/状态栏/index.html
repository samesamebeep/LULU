<!-- LULU FINAL | self-contained status runtime -->
<body>
<script>
(async function(){
  const base=String(window.__LULU_FINAL_STATUS_BASE||'');
  if(!base){
    console.error('[秦璐重置版·FINAL] 缺少状态栏资源基址');
    document.body.innerHTML='<div style="padding:12px;color:#e06868">状态栏资源基址缺失，请重新导入 FINAL 卡。</div>';
    return;
  }
  $('body').load(base+'core.html',async function(){
    try{
      const mod=await import(base+'runtime.js');
      if(typeof mod.installStatusPatch==='function') mod.installStatusPatch();
      console.info('[秦璐重置版·FINAL] 状态栏加载完成');
    }catch(err){
      console.error('[秦璐重置版·FINAL] 状态栏运行模块加载失败',err);
      const host=window.parent??window;
      host.toastr?.error?.('状态栏运行模块加载失败：'+(err?.message??String(err)),'秦璐重置版 FINAL',{timeOut:0,extendedTimeOut:0});
    }
  });
})();
</script>
</body>
