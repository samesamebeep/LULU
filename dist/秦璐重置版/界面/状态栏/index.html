<script>
(function(){
  const statusUrl = 'https://testingcf.jsdelivr.net/gh/samesamebeep/LULU@855a2f2ad250ad5b13482e1b3e9c2781a96e74a6/dist/秦璐重置版/界面/状态栏/index.html';
  const UI_PATCH_BUILD = 'coherent-ui-v9-ending-state-fix-20261008';
  const ACTIVE_TAB_KEY = '秦璐重置版:status_bar:active_tab';
  const LAST_CHAR_KEY = '秦璐重置版:status_bar:last_theme_character';
  const STAGE_CLASSES = ['th-stage-1','th-stage-2','th-stage-3','th-stage-4','th-stage-5'];
  let lastThemeCharacter = '秦璐';
  let observer = null;
  let timer = null;
  let refreshQueued = false;

  function hostWindow(){
    try{return window.parent && window.parent!==window ? window.parent : window;}catch(e){return window;}
  }

  function lodash(){
    const h=hostWindow();
    return window._ || h._ || null;
  }

  let nativeGetCurrentMessageId = null;

  function savedActiveTab(){
    try{
      const v=localStorage.getItem(ACTIVE_TAB_KEY);
      if(!v) return '';
      try{return JSON.parse(v);}catch(e){return String(v).replace(/^"|"$/g,'');}
    }catch(e){return '';}
  }

  function isShopTabActive(){
    try{
      const active=document.querySelector('.tab-btn.active .tab-label');
      const txt=(active?.textContent||'').trim();
      if(txt) return txt==='网店';
    }catch(e){}
    return savedActiveTab()==='网店';
  }

  function installShopLatestMessageProxy(){
    if(nativeGetCurrentMessageId) return;

    const h=hostWindow();
    let source=null, sourceThis=null;
    try{
      if(typeof window.getCurrentMessageId==='function'){
        source=window.getCurrentMessageId;
        sourceThis=window;
      }else if(typeof h.getCurrentMessageId==='function'){
        source=h.getCurrentMessageId;
        sourceThis=h;
      }
    }catch(e){}

    if(typeof source!=='function') return;

    nativeGetCurrentMessageId=function(){
      try{return Number(source.call(sourceThis));}
      catch(e){return -1;}
    };

    const proxy=function(){
      // 只有网店页强制指向最新楼；角色历史页仍保持原来的历史读取。
      if(isShopTabActive()){
        const len=chatLength();
        if(len>0) return len-1;
      }
      return nativeGetCurrentMessageId();
    };

    try{
      Object.defineProperty(window,'getCurrentMessageId',{
        configurable:true,
        enumerable:true,
        writable:true,
        value:proxy
      });
    }catch(e){
      try{window.getCurrentMessageId=proxy;}catch(_){}
    }
  }

  function getCurrentMid(){
    const h=hostWindow();
    try{
      const fn=window.getCurrentMessageId || h.getCurrentMessageId;
      if(typeof fn==='function') return Number(fn());
    }catch(e){}
    return -1;
  }

  function chatLength(){
    const h=hostWindow();
    try{return Number((window.SillyTavern||h.SillyTavern)?.chat?.length ?? 0);}catch(e){return 0;}
  }

  function isLatestMessage(){
    const mid=getCurrentMid(), len=chatLength();
    if(mid<0 || len<=0) return true;
    return mid >= len-1;
  }

  function readStatAt(messageId){
    const h=hostWindow(), _=lodash();
    const M=window.Mvu || h.Mvu;

    try{
      if(M && typeof M.getMvuData==='function'){
        const d=M.getMvuData({type:'message',message_id:messageId});
        const stat=_ && _.get ? _.get(d,'stat_data') : d && d.stat_data;
        if(stat && typeof stat==='object') return stat;
      }
    }catch(e){}

    try{
      const getter=window.getVariables || h.getVariables;
      if(typeof getter==='function'){
        const d=getter({type:'message',message_id:messageId});
        const stat=_ && _.get ? _.get(d,'stat_data') : d && d.stat_data;
        if(stat && typeof stat==='object') return stat;
      }
    }catch(e){}
    return null;
  }

  function readVisibleStat(){
    const mid=getCurrentMid();
    if(isLatestMessage()){
      return readStatAt(-1) || (mid>=0 ? readStatAt(mid) : null);
    }
    return mid>=0 ? readStatAt(mid) : null;
  }

  function normalizeStage(v){
    const n=Math.floor(Number(v));
    return Number.isFinite(n) ? Math.max(1,Math.min(5,n)) : 1;
  }

  function getActiveTabName(){
    try{
      const active=document.querySelector('.tab-btn.active .tab-label');
      const txt=(active?.textContent||'').trim();
      if(txt) return txt;
    }catch(e){}
    try{
      const v=localStorage.getItem(ACTIVE_TAB_KEY);
      if(v) return String(v).replace(/^"|"$/g,'');
    }catch(e){}
    return '';
  }

  function restoreLastThemeCharacter(){
    try{
      const saved=localStorage.getItem(LAST_CHAR_KEY);
      if(saved==='秦璐' || saved==='秦曼华') lastThemeCharacter=saved;
      else{
        const tab=String(localStorage.getItem(ACTIVE_TAB_KEY)||'').replace(/^"|"$/g,'');
        if(tab==='秦璐' || tab==='秦曼华') lastThemeCharacter=tab;
      }
    }catch(e){}
  }

  function rememberThemeCharacter(name){
    if(name!=='秦璐' && name!=='秦曼华') return;
    lastThemeCharacter=name;
    try{localStorage.setItem(LAST_CHAR_KEY,name);}catch(e){}
  }

  function resolveThemeCharacter(){
    const tab=getActiveTabName();
    if(tab==='秦璐' || tab==='秦曼华'){
      rememberThemeCharacter(tab);
      return tab;
    }
    return lastThemeCharacter;
  }

  function resolveThemeStage(){
    const stat=readVisibleStat();
    const who=resolveThemeCharacter();
    return normalizeStage(stat?.[who+'状态']?.当前阶段 ?? 1);
  }

  // 原 855 UI 的主题角色 ref 在刷新后默认是秦璐；
  // 如果保存的活动页是秦曼华/网店，会出现“面板是一个角色、颜色却还是另一个角色”的情况。
  // 这里仅同步根节点 th-stage-*，不覆盖 UI 自身的五套主题色。
  function syncRootStageClass(){
    const root=document.querySelector('.frost-root');
    if(!root) return;
    const wanted='th-stage-'+resolveThemeStage();
    let changed=false;
    for(const cls of STAGE_CLASSES){
      if(cls!==wanted && root.classList.contains(cls)){
        root.classList.remove(cls);
        changed=true;
      }
    }
    if(!root.classList.contains(wanted)){
      root.classList.add(wanted);
      changed=true;
    }
    return changed;
  }

  function syncExternalPanelTheme(){
    const root=document.querySelector('.frost-root');
    if(!root) return;

    const cs=getComputedStyle(root);
    const vars=['--acc','--acc2','--bg1','--bg2','--line','--panel','--glow','--glow2'];
    const panels=[
      document.getElementById('awei-pov-panel'),
      document.getElementById('secret-stats-panel')
    ].filter(Boolean);

    for(const panel of panels){
      for(const key of vars){
        const value=cs.getPropertyValue(key).trim();
        if(value) panel.style.setProperty(key,value);
      }
      panel.dataset.themeStage=String(resolveThemeStage());
    }
  }

  function normalizeAweiThought(v){
    if(!v || typeof v!=='object') return null;
    return {
      在场: v.在场===true || v.在场==='true',
      内容: typeof v.内容==='string' ? v.内容.trim() : ''
    };
  }

  function readAweiThoughtAt(messageId){
    const stat=readStatAt(messageId);
    return normalizeAweiThought(stat?.系统?.阿伟本轮心思);
  }

  function meaningfulThought(v){
    return !!v && (v.在场===true || !!v.内容);
  }

  function readAweiThought(){
    const mid=getCurrentMid();

    // 最新楼：-1 是权威来源；只有它仍是默认空对象时，才回退到当前 message id。
    if(isLatestMessage()){
      const latest=readAweiThoughtAt(-1);
      if(meaningfulThought(latest)) return latest;
      const direct=mid>=0 ? readAweiThoughtAt(mid) : null;
      if(meaningfulThought(direct)) return direct;
      return latest || direct || {在场:false,内容:''};
    }

    // 回看旧楼时必须读旧楼，避免把“最新一轮心思”串进历史消息。
    return (mid>=0 ? readAweiThoughtAt(mid) : null) || {在场:false,内容:''};
  }

  function findSuwenSection(){
    const sections=[...document.querySelectorAll('section')];
    return sections.find(sec=>{
      const h3=sec.querySelector(':scope > h3') || sec.querySelector('h3');
      return (h3?.textContent||'').trim().startsWith('苏文');
    }) || null;
  }

  function ensureAweiThoughtPanel(){
    const suwen=findSuwenSection();
    let panel=document.getElementById('awei-thought-panel');

    if(!suwen){
      if(panel) panel.remove();
      return null;
    }

    if(!panel){
      panel=document.createElement('section');
      panel.id='awei-thought-panel';
      panel.className='awei-thought-panel';
      panel.innerHTML=
        '<div class="awei-thought-head">'+
          '<span class="awei-thought-name">阿伟</span>'+
          '<span class="awei-thought-label">本轮心思</span>'+
          '<span class="awei-thought-chip">未在场</span>'+
        '</div>'+
        '<blockquote class="awei-thought-body empty">暂无本轮心思</blockquote>';
      suwen.insertAdjacentElement('afterend',panel);
    }else if(panel.previousElementSibling!==suwen){
      suwen.insertAdjacentElement('afterend',panel);
    }
    return panel;
  }

  function updateAweiThoughtPanel(){
    const panel=ensureAweiThoughtPanel();
    if(!panel) return;

    const thought=readAweiThought();
    const chip=panel.querySelector('.awei-thought-chip');
    const body=panel.querySelector('.awei-thought-body');
    const present=thought?.在场===true;
    const text=thought?.内容 || '';

    if(chip){
      const desired=present?'在场':'未在场';
      if(chip.textContent!==desired) chip.textContent=desired;
      chip.classList.toggle('present',present);
    }
    if(body){
      const desired=text || '暂无本轮心思';
      if(body.textContent!==desired) body.textContent=desired;
      body.classList.toggle('empty',!text);
    }
  }

  function lerp(a,b,t){
    return Math.round(a+(b-a)*t);
  }

  function rgbMix(a,b,t){
    return [
      lerp(a[0],b[0],t),
      lerp(a[1],b[1],t),
      lerp(a[2],b[2],t)
    ];
  }

  function rgbCss(c){
    return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
  }

  function rgbaCss(c,a){
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  }

  function updateAweiDependVisuals(){
    const rows=[...document.querySelectorAll('.bar')];

    for(const row of rows){
      const label=row.querySelector('.bl');
      if((label?.textContent||'').trim()!=='阿伟') continue;

      row.classList.add('awei-depend-row');

      const valueEl=row.querySelector('.bv');
      const fill=row.querySelector('.fill.f-awei') || row.querySelector('.fill');
      let value=Number((valueEl?.textContent||'').trim());

      // 如果 DOM 文本暂时还没更新，回退读取当前可见角色变量。
      if(!Number.isFinite(value)){
        const stat=readVisibleStat();
        const panel=row.closest('.char-panel');
        const activeName=getActiveTabName();
        const who=(activeName==='秦璐'||activeName==='秦曼华')?activeName:lastThemeCharacter;
        value=Number(stat?.[who+'状态']?.对阿伟依存度 ?? 15);
      }

      value=Math.max(0,Math.min(100,Number.isFinite(value)?value:15));
      const p=value/100;

      // 0~35 仍偏原本的棕金色；之后逐步转成绿色，80+明显发亮。
      const greenT=Math.max(0,Math.min(1,(value-20)/80));
      const low=[139,98,63];
      const high=[78,235,116];
      const c=rgbMix(low,high,greenT);
      const c2=rgbMix([105,76,53],[44,181,82],greenT);

      if(fill){
        fill.style.background='linear-gradient(90deg,'+rgbCss(c2)+','+rgbCss(c)+')';

        const glowAlpha=(0.08 + 0.64*Math.pow(p,1.65)).toFixed(3);
        const glowRadius=Math.round(3 + 15*Math.pow(p,1.5));
        fill.style.boxShadow=
          '0 0 '+glowRadius+'px '+rgbaCss(c,glowAlpha)+
          (value>=80 ? ', 0 0 '+Math.round(glowRadius*1.7)+'px '+rgbaCss(c,(0.16+0.26*p).toFixed(3)) : '');
        fill.style.filter='saturate('+(1+0.42*p).toFixed(2)+') brightness('+(0.92+0.25*p).toFixed(2)+')';
      }

      const textT=Math.max(0,Math.min(1,(value-35)/65));
      const textColor=rgbMix([185,173,154],[117,255,150],textT);
      if(label){
        label.style.color=rgbCss(textColor);
        label.style.textShadow=value>=60 ? '0 0 '+Math.round(2+7*p)+'px '+rgbaCss(c,(0.18+0.42*p).toFixed(3)) : '';
      }
      if(valueEl){
        valueEl.style.color=rgbCss(textColor);
        valueEl.style.textShadow=value>=60 ? '0 0 '+Math.round(2+8*p)+'px '+rgbaCss(c,(0.16+0.48*p).toFixed(3)) : '';
      }

      let hat=row.querySelector('.awei-hat-icon');
      if(!hat && label){
        hat=document.createElement('span');
        hat.className='awei-hat-icon';
        hat.setAttribute('aria-label','阿伟依存度达到80');
        hat.title='阿伟依存度达到 80+';
        label.insertAdjacentElement('afterend',hat);
      }
      row.classList.toggle('awei-hat-active',value>=80);

      // 高值时整行极轻微绿辉，不遮盖阶段主题。
      if(value>=80){
        const a=(0.025+0.045*(value-80)/20).toFixed(3);
        row.style.background='linear-gradient(90deg,'+rgbaCss(c,a)+',transparent 65%)';
        row.style.boxShadow='0 0 '+Math.round(4+8*(value-80)/20)+'px '+rgbaCss(c,(0.05+0.12*(value-80)/20).toFixed(3));
      }else{
        row.style.background='';
        row.style.boxShadow='';
      }
    }
  }

  function syncShopInteractionBridge(){
    const shop=isShopTabActive();
    document.body.classList.toggle('shop-live-bridge',shop);

    if(!shop) return;

    // Vue 的旧楼只读类会让整块商店 pointer-events:none。
    // 商店本身所有操作本来就写 message_id:-1，所以这里允许它操作最新存档。
    document.querySelectorAll('.panel-host.readonly').forEach(el=>{
      el.classList.remove('readonly');
      el.dataset.shopBridge='latest';
      el.style.pointerEvents='auto';
      el.style.opacity='1';
      el.style.filter='none';
    });

    const guard=document.querySelector('.stale-guard');
    if(guard){
      guard.textContent='🛒 网店已连接最新存档 · 购买/装备/活动操作会写入最新楼层';
    }
  }

  function refreshUiPatch(){
    refreshQueued=false;
    injectPatchCss();
    syncShopInteractionBridge();
    syncRootStageClass();
    syncExternalPanelTheme();
    updateAweiThoughtPanel();
    updateAweiDependVisuals();
  }

  function queueRefresh(){
    if(refreshQueued) return;
    refreshQueued=true;
    requestAnimationFrame(refreshUiPatch);
  }

  function bindTabTracking(){
    document.addEventListener('click',function(ev){
      const btn=ev.target?.closest?.('.tab-btn');
      if(!btn) return;
      const txt=(btn.querySelector('.tab-label')?.textContent||'').trim();
      if(txt==='秦璐' || txt==='秦曼华') rememberThemeCharacter(txt);
      setTimeout(queueRefresh,0);
      setTimeout(queueRefresh,80);
      setTimeout(queueRefresh,550);
    },true);
  }

  function startUiWatchers(){
    restoreLastThemeCharacter();
    injectPatchCss();
    bindTabTracking();
    queueRefresh();

    if(observer) observer.disconnect();
    observer=new MutationObserver(queueRefresh);
    observer.observe(document.body,{
      childList:true,
      subtree:true,
      attributes:true,
      attributeFilter:['class']
    });

    if(timer) clearInterval(timer);
    // 仅作变量变化兜底；DOM 结构变化主要由 MutationObserver 驱动。
    timer=setInterval(queueRefresh,1200);
  }

  installShopLatestMessageProxy();

  $('body').load(statusUrl,function(){
    startUiWatchers();
    // 远端 Vue mount 后再补几次，处理旧楼 readonly 初次渲染。
    setTimeout(queueRefresh,0);
    setTimeout(queueRefresh,250);
    setTimeout(queueRefresh,650);
  });
})();
</script>
</body>
